<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to the Reading Test</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome to the AfterSchoolReadTest!</h1>
        <p style="text-align:center;">This is a simple reading test designed for elementary school students.</p>
        <div style="text-align:center; margin-bottom: 20px;">
             <a href="{{ url_for('test_page', grade=1, level=1) }}">Start Test (Grade 1, Level 1)</a>
        </div>

        <form id="index-form" action="javascript:void(0);" onsubmit="navigateToTest(); return false;"> <!-- Use onsubmit for the form itself -->
             <h2>Or select a starting point:</h2>
             <label for="grade">Grade:</label>
             <select name="grade" id="grade">
                 <option value="1">Grade 1</option>
                 <option value="2">Grade 2</option>
                 <!-- Add more grades as needed -->
             </select>
             <label for="level" style="margin-left:10px;">Level:</label>
             <select name="level" id="level">
                 {% for i in range(1, 21) %} <!-- Assuming 20 levels -->
                 <option value="{{i}}">Level {{i}}</option>
                 {% endfor %}
             </select>
             <button type="submit" style="margin-left:10px;">Go to Selected Level</button>
        </form>
    </div>

    <script>
        function navigateToTest() {
            const grade = document.getElementById('grade').value;
            const level = document.getElementById('level').value;
            if(grade && level){
                 window.location.href = `/test/${grade}/${level}`;
            }
        }
    </script>
</body>
</html>
